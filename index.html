<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7EF" />
    <!-- PWA — <link rel="manifest">는 vite-plugin-pwa가 빌드 때 주입한다.
         아래 셋은 iOS 전용이라 manifest로는 안 먹어서 직접 적는다.
         apple-touch-icon은 PNG만 받는다(SVG 불가) — 브랜드 아이콘이 나오면 그때 추가한다.
         그 전까지 iOS 홈 화면 아이콘은 페이지 스크린샷으로 잡힌다. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="어디냐옹" />
    <!-- 브랜드 폰트 (Gaegu=제목, Gowun Dodum=본문). 자체 호스팅이라 외부 커넥션이 없다.
         앱 CSS와 한 파일로 합치면 안 된다 — 이유는 src/fonts.css 맨 위 주석 참고.
         서약서 전용 Nanum Myeongjo는 PledgeOverlay가 열릴 때만 동적으로 받는다.
         Google Fonts <link>는 2026-09-14에 제거했다 — 외부 DNS/TLS 2회가 첫 페인트를 늦췄다. -->
    <link rel="stylesheet" href="/src/fonts.css" />
    <title>어디냐옹</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
